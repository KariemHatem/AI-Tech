<section class="container-fluid sec-bg-color pd-top pd-bottom">
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div class="d-flex justify-content-center flex-column">
          <app-info-button
            [btnText]="'TESTIMONIALS.BADGE' | translate"
            customeClass="txt-primary bg-white"
          />
          <h2 class="fw-bold display-6 txt-dark">{{ 'TESTIMONIALS.TITLE' | translate }}</h2>
          <p class="txt-secondary">
            {{ 'TESTIMONIALS.DESC' | translate }}
          </p>
        </div>
      </div>

      <div class="col-lg-6 position-relative review">
        <div class="divider"></div>
        <div class="testimonials">
          <p-carousel
            [value]="textimonails()"
            [numVisible]="1"
            [numScroll]="1"
            [circular]="true"
            [autoplayInterval]="3000"
          >
            <ng-template let-testimonial #item>
              <i class="pi pi-comments txt-primary fw-bold fs-3 mb-3"></i>

              <div class="testimonial-card mx-3 text-center">
                <p class="txt-secondary fs-5 fst-italic mb-4">
                  "{{ testimonial.desc | translate }}"
                </p>

                <div class="review-info d-flex flex-column align-items-center">
                  <img [src]="testimonial.img" [alt]="testimonial.name" class="mb-2" />
                  <p class="fw-bold mb-0">{{ testimonial.name }}</p>
                </div>
              </div>
            </ng-template>
          </p-carousel>
        </div>
      </div>
    </div>
  </div>
</section>
