<section class="container-fluid pd-top pd-bottom">
  <div class="container">
    <div class="d-flex justify-content-center align-items-center flex-column">
      <app-info-button [btnText]="'FAQ.BADGE' | translate" customeClass="txt-primary bg-white" />
      <h2 class="fw-bold display-6 txt-dark">{{ 'FAQ.TITLE' | translate }}</h2>
    </div>
    <div class="faq mt-3">
      <p-accordion [value]="['0']" class="row">
        @for (tab of faqsData(); track tab.title) {
          <div class="col-lg-6 mb-2">
            <p-accordion-panel [value]="tab.value">
              <p-accordion-header>{{ tab.title | translate }}</p-accordion-header>
              <p-accordion-content>
                <p class="mt-3 txt-secondary">{{ tab.content | translate }}</p>
              </p-accordion-content>
            </p-accordion-panel>
          </div>
        }
      </p-accordion>
    </div>
  </div>
</section>
