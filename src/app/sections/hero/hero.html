<section class="hero container-fluid pt-5 mb-3">
  <div class="container">
    <div class="row d-flex justify-content-center align-items-center mb-3">
      <div class="col-lg-6 h-content">
        <div data-aos="fade-down">
          <app-info-button
            [btnText]="'HERO.BADGE' | translate"
            customeClass="txt-white bg-color border-light"
          />
        </div>
        <div class="head-txt text-white">
          <h1 class="fw-bold display-3" data-aos="fade-up" data-aos-delay="100">
            {{ 'HERO.TITLE' | translate }}
          </h1>
          <p class="mb-3" data-aos="fade-up" data-aos-delay="250">
            {{ 'HERO.SUBTITLE' | translate }}
          </p>
        </div>
        <div class="btns d-flex gap-3 align-items-center" data-aos="fade-up" data-aos-delay="400">
          <button class="btn rounded-pill px-3 py-2 border-light read-more">
            {{ 'HERO.READ_MORE' | translate }}
          </button>
          <button class="btn rounded-pill px-3 py-2 border-light bg-color text-white">
            {{ 'HERO.CONTACT_US' | translate }}
          </button>
        </div>
      </div>
      <div class="col-lg-6">
        <img
          src="assets/images/hero-img.png"
          class="hero-img mt-5"
          alt="AI.Tech"
          data-aos="zoom-in"
          data-aos-delay="300"
          data-aos-duration="1000"
        />
      </div>
    </div>
  </div>
</section>
