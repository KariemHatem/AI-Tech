<section class="not-found d-flex justify-content-center align-items-center text-center mt-5">
  <div class="not-found-content">
    <i class="pi pi-exclamation-triangle txt-primary" data-aos="zoom-in"></i>
    <div
      class="d-flex justify-content-center align-items-center flex-column mb-3"
      data-aos="fade-up"
      data-aos-delay="100"
    >
      <h1 class="fw-bold display-6 txt-dark mb-0">
        {{ 'PAGES.NOT_FOUND.TITLE' | translate }} <br />{{ 'PAGES.NOT_FOUND.SUBTITLE' | translate }}
      </h1>
    </div>

    <p class="mb-4 px-3" data-aos="fade-up" data-aos-delay="200">
      {{ 'PAGES.NOT_FOUND.DESC' | translate }}
    </p>

    <button
      class="bg-color txt-white border-0 rounded-pill px-3 py-2"
      [routerLink]="['/home']"
      data-aos="fade-up"
      data-aos-delay="300"
    >
      {{ 'PAGES.NOT_FOUND.BTN' | translate }}
    </button>
  </div>
</section>
<app-newsletter />
