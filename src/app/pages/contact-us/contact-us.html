<section class="container-fluid pd-top">
  <div class="container">
    <div class="sec-content d-flex justify-content-center align-items-center flex-column">
      <app-info-button [btnText]="'CONTACT.BADGE' | translate" customeClass="txt-primary bg-white" />
      <h2 class="fw-bold display-6 txt-dark">{{ 'CONTACT.TITLE' | translate }}</h2>
      <p class="txt-secondary text-center">
        {{ 'CONTACT.DESC' | translate }}
      </p>
    </div>

    <div class="contact-form mt-3">
      <app-contact-form />
    </div>
  </div>
</section>
