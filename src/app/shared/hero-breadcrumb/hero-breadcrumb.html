<section class="hero container-fluid pt-5">
  <div class="container">
    <div class="row d-flex justify-content-center align-items-center">
      <div class="col-lg-6 h-content">
        <h2 class="txt-white fw-bold fs-1" data-aos="fade-up">{{ heading() }}</h2>
        <div data-aos="fade-up" data-aos-delay="150">
          <p-breadcrumb [home]="home()" [model]="translatedItems()" />
        </div>
      </div>
      <div class="col-lg-6 img-col">
        <img
          src="assets/images/hero-img.png"
          class="hero-img mt-5"
          alt="AI.Tech"
          data-aos="zoom-in"
          data-aos-delay="200"
          data-aos-duration="1000"
        />
      </div>
    </div>
  </div>
</section>
